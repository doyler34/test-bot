<div class="ctl-power">
  {% for action, label in (("start", "Start"), ("restart", "Restart"), ("stop", "Stop")) %}
  {% if can("power") and amp %}
  <form method="post" action="/server/{{ c.id }}/power/{{ action }}" data-confirm="{{ label }} {{ c.name }}?{{ ' Everyone on it gets kicked.' if action != 'start' }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="ctl-btn {{ action }}">{{ label }}</button>
  </form>
  {% else %}
  <button type="button" class="ctl-btn {{ action }}" disabled title="{{ 'Connect the panel to AMP to use this' if can('power') else 'Needs the start and stop permission' }}">{{ label }}</button>
  {% endif %}
  {% endfor %}
</div>
