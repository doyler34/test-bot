{% extends "base.html" %}
{% block title %}Account · OYB Control{% endblock %}
{% block body %}
<form class="card narrow" method="post" action="/account">
  <h1>Change password</h1>
  {% if user.must_change %}<div class="flash">Pick your own password before you carry on.</div>{% endif %}
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Current password <input name="current" type="password" autocomplete="current-password" required></label>
  <label>New password <input name="new" type="password" autocomplete="new-password" minlength="10" required></label>
  <label>New password again <input name="confirm" type="password" autocomplete="new-password" minlength="10" required></label>
  <button>Save</button>
</form>
{% endblock %}
